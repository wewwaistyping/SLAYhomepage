<style>
:root{--top:44px;--w:#eef2fa;--soft:#aab4c8;--dim:#5f6a80;--glow:#9fc6ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04060b;color:var(--w);font-family:'Alegreya',serif}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg.fil{fill:currentColor;overflow:visible}

/* сине-чёрная глубина, светлое пятно за фигурой */
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 34% 55% at 48% 55%,#1b2a44aa,transparent 70%),radial-gradient(ellipse 100% 90% at 50% 40%,#0b1220,#04060b 80%)}
.motes{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.motes i{position:absolute;left:var(--x);top:100%;width:var(--s);height:var(--s);border-radius:50%;background:#d7e8ff;box-shadow:0 0 8px 3px #7fb2ff55;opacity:0;animation:float var(--d) linear var(--dl) infinite;will-change:transform,opacity}
@keyframes float{0%{opacity:0;transform:translate(0,0)}20%{opacity:var(--o)}80%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--dx),-105vh)}}

/* заголовок с завитками */
.title{position:fixed;left:0;right:0;top:calc(var(--top) + 2.5vh);z-index:3;display:flex;flex-direction:column;align-items:center;color:var(--w)}
.title h1{font:400 clamp(22px,2vw,30px) 'Forum';letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}
.title svg{width:min(480px,74vw);height:auto;aspect-ratio:480/44;margin-top:4px;color:#dfe6f3}

/* список записей */
.list{position:fixed;left:4vw;top:calc(var(--top) + 120px);bottom:6vh;width:min(290px,21vw);z-index:3;display:flex;gap:14px}
.ents{flex:1;min-width:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:2px;padding:4px 0;-webkit-mask-image:linear-gradient(transparent,#000 6%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 90%,transparent)}
.ch{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:7px 30px 7px 28px;font:400 17px 'Alegreya';color:var(--soft);transition:color .2s}
.ch img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:top;filter:grayscale(1) brightness(.75) sepia(.2) hue-rotate(180deg);opacity:.7;flex:none}
.ch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch svg{position:absolute;top:50%;width:20px;height:22px;margin-top:-11px;opacity:0;transition:opacity .2s;color:var(--w)}
.ch svg.l{left:2px}.ch svg.r{right:4px;transform:scaleX(-1)}
.ch:hover{color:var(--w)}
.ch.on{color:#fff;text-shadow:0 0 12px #9fc6ff88}
.ch.on img{filter:none;opacity:1}
.ch.on svg{opacity:1}
/* ажурная полоса прокрутки с ромбом */
.rail{position:relative;width:12px;flex:none}
.rail::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:linear-gradient(transparent,#aab4c866 10%,#aab4c866 90%,transparent)}
.rail i{position:absolute;left:1px;width:9px;height:9px;border:1px solid var(--w);background:#04060b;transform:rotate(45deg);transition:top .3s;box-shadow:0 0 8px #9fc6ff}

/* фигура */
.hero{position:fixed;left:calc(6vw + min(290px,21vw));right:calc(min(430px,31vw) + 6vw);top:calc(var(--top) + 96px);bottom:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:1}
.hero img.full{max-height:100%;max-width:100%;object-fit:contain;filter:saturate(.75) brightness(.9);-webkit-mask-image:linear-gradient(0deg,transparent,#000 16%);mask-image:linear-gradient(0deg,transparent,#000 16%)}
/* без PNG: портрет в белой ажурной раме */
.hero .frm{align-self:center;position:relative;margin-bottom:8vh;width:min(19vw,270px);aspect-ratio:2/3;padding:12px;border:1px solid #dfe6f399;box-shadow:inset 0 0 0 5px #04060b,inset 0 0 0 6px #dfe6f344,0 0 50px #6f9fe022}
.hero .frm>img{width:100%;height:100%;object-fit:cover;object-position:top;filter:saturate(.6) brightness(.85) hue-rotate(-10deg)}
.hero .frm svg{position:absolute;width:44px;height:44px;color:var(--w)}
.hero .frm svg:nth-of-type(1){left:-14px;top:-14px}
.hero .frm svg:nth-of-type(2){right:-14px;top:-14px;transform:scaleX(-1)}
.hero .frm svg:nth-of-type(3){left:-14px;bottom:-14px;transform:scaleY(-1)}
.hero .frm svg:nth-of-type(4){right:-14px;bottom:-14px;transform:scale(-1)}
.hero.in{animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

/* запись справа */
.entry{position:fixed;right:4vw;top:calc(var(--top) + 120px);bottom:6vh;width:min(430px,31vw);z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center}
.entry h2{font:400 clamp(26px,2.4vw,38px)/1.1 'Forum';letter-spacing:.12em;text-transform:uppercase}
.entry .div{width:300px;height:auto;aspect-ratio:480/44;margin:8px 0 14px;color:#dfe6f3}
.entry p.d{font:400 17px/1.6 'Alegreya';color:#d6dcea;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.entry p.d.none{font-style:italic;color:var(--soft)}
.kills{margin-top:18px;font:500 15px 'Alegreya Sans SC';letter-spacing:2px;color:var(--soft)}
.kills b{font:400 22px 'Forum';color:#fff;margin-left:6px;letter-spacing:1px}
.notes{margin-top:16px;width:100%;padding-top:12px;border-top:1px solid;border-image:linear-gradient(90deg,transparent,#aab4c855,transparent) 1}
.notes h4{font:500 13px 'Alegreya Sans SC';letter-spacing:3px;color:var(--dim);margin-bottom:6px}
.notes p{font:italic 400 15px/1.5 'Alegreya';color:var(--soft)}

/* меню: по центру, выбранное между двумя «лилиями» */
.menu{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:14px}
.menu button{position:relative;padding:4px 38px;font:400 19px 'Alegreya';letter-spacing:1px;color:var(--soft);text-align:center;transition:color .15s}
.menu button svg{position:absolute;top:50%;width:26px;height:16px;margin-top:-8px;opacity:0;transition:opacity .15s,transform .2s;color:var(--w)}
.menu button svg.l{left:0;transform:translateX(-6px)}.menu button svg.r{right:0;transform:scaleX(-1) translateX(-6px)}
.menu button.on{color:#fff;text-shadow:0 0 10px #9fc6ff99}
.menu button.on svg{opacity:1}
.menu button.on svg.l{transform:none}.menu button.on svg.r{transform:scaleX(-1)}

@media (max-width:760px){
  .title{top:calc(var(--top) + 6px)}
  .title h1{font-size:16px;letter-spacing:.3em}
  .title svg{width:300px}
  .list{left:3vw;right:3vw;width:auto;top:calc(var(--top) + 48px);bottom:auto;height:44px}
  .rail{display:none}
  .ents{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
  .ch{font-size:15px;padding:6px 24px 6px 22px;gap:8px}.ch img{width:22px;height:22px}
  .ch svg{width:16px;height:18px;margin-top:-9px}
  .hero{left:0;right:0;top:calc(var(--top) + 96px);bottom:330px}
  .hero .frm{width:36vw;margin:0;padding:8px}.hero .frm svg{width:30px;height:30px}
  .entry{left:5vw;right:5vw;width:auto;top:auto;bottom:14px;height:316px}
  .entry h2{font-size:22px}.entry .div{width:240px;margin:4px 0 6px}
  .entry p.d{font-size:14px;-webkit-line-clamp:3}
  .kills{margin-top:6px;font-size:13px}.kills b{font-size:17px}
  .notes{display:none}
  .menu{gap:0;padding-top:6px}.menu button{font-size:16px;padding:3px 34px}
}
</style>
</head>
