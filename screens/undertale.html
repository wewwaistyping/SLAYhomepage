<!-- Шрифты грузятся в фоне: если Google не отвечает, экран появится через 1,2 с системным шрифтом, а не останется пустым -->
<script>document.documentElement.classList.add('fw');setTimeout(() => document.documentElement.classList.remove('fw'), 1200);</script>
<style>.fw body{visibility:hidden}</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet" media="print" onload="this.media='all';document.documentElement.classList.remove('fw')" onerror="document.documentElement.classList.remove('fw')">
<style>
:root{--top:44px;--or:#ff7f27;--yl:#ffff00;--red:#ff0000;--l:320px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Tiny5',monospace}
img,canvas{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.box{border:4px solid #fff;background:#000}

/* зелёная сетка за монстром, как фон битвы */
.grid{position:fixed;left:var(--l);right:30px;top:calc(var(--top) + 18px);height:44%;opacity:.55;background:linear-gradient(#0f6a2a 2px,transparent 2px) 0 0/72px 72px,linear-gradient(90deg,#0f6a2a 2px,transparent 2px) 0 0/72px 72px;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent);pointer-events:none}

/* слева: список целей с сердцем-курсором */
.roster{position:fixed;left:24px;top:calc(var(--top) + 18px);bottom:24px;width:calc(var(--l) - 48px);display:flex;flex-direction:column;padding:14px 10px 14px 12px}
.roster h3{font:400 13px 'Press Start 2P';color:var(--yl);margin:0 0 12px 6px}
.list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:5px 4px;font:400 22px/1.1 'Tiny5'}
.row .sl{flex:none;width:18px;height:16px;visibility:hidden}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover span{color:var(--yl)}
.row.on .sl{visibility:visible}
.row.on span{color:var(--yl)}

/* монстр: пиксельный, чёрно-белый */
.mon{position:fixed;left:var(--l);right:30px;top:calc(var(--top) + 24px);bottom:calc(24px + 56px + 40px + 166px + 14px);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.mon canvas.full{height:100%;max-height:100%;max-width:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 -3px 0 #fff);animation:wob 2.4s steps(2) infinite}
@keyframes wob{50%{transform:translateY(-3px)}}
/* без PNG — портрет в пиксельной рамке, по центру */
.mon .frm{align-self:center;width:min(17vw,210px);aspect-ratio:2/3;padding:8px;border:6px solid #fff;outline:4px solid #000;outline-offset:-14px}
.mon .frm canvas{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.mon.in{animation:blink .35s steps(2) 2}
@keyframes blink{50%{opacity:0}}
/* пузырь с репликой справа от монстра */
.bub{position:fixed;left:calc(50% + var(--l) / 2 + 150px);top:calc(var(--top) + 60px);width:270px;padding:12px 14px;background:#fff;color:#000;border-radius:10px;font:400 18px/1.15 'Tiny5'}
.bub::before{content:'';position:absolute;left:-14px;top:22px;border:8px solid transparent;border-right:14px solid #fff;border-left:0}
.bub p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}

/* текстовое окно, строка ОЗ, кнопки */
.bottom{position:fixed;left:var(--l);right:30px;bottom:24px;display:flex;flex-direction:column;align-items:center}
.txt{width:min(100%,900px);height:166px;padding:20px 26px;font:400 30px/1.3 'Tiny5';white-space:pre-wrap;overflow:hidden}
.stats{width:min(100%,900px);display:flex;align-items:center;gap:28px;height:40px;margin-top:8px;font:400 16px 'Press Start 2P'}
.stats .hpb{display:flex;align-items:center;gap:12px}
.stats .hpb small{font-size:11px}
.stats .bar{width:90px;height:22px;background:var(--red)}
.stats .bar i{display:block;height:100%;background:var(--yl)}
.menu{width:min(100%,900px);display:flex;justify-content:space-between;gap:14px;margin-top:8px}
.menu button{flex:1;max-width:200px;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;border:4px solid var(--or);color:var(--or);font:400 17px 'Press Start 2P'}
.menu button svg{flex:none;width:26px;height:26px}
.menu button .h{display:none}
.menu button.on{border-color:var(--yl);color:var(--yl)}
.menu button.on .ic{display:none}.menu button.on .h{display:block}

@media (max-width:760px){
  :root{--l:0px}
  .roster{left:8px;right:8px;width:auto;top:calc(var(--top) + 6px);bottom:auto;height:62px;flex-direction:row;align-items:center;padding:6px 8px}
  .roster h3{display:none}
  .list{display:flex;gap:4px;overflow-x:auto}
  .row{flex:none;width:auto;font-size:17px;padding:4px 6px}
  .grid{left:8px;right:8px;top:calc(var(--top) + 76px);height:30%}
  .mon{left:8px;right:8px;top:calc(var(--top) + 80px);bottom:calc(10px + 106px + 34px + 126px + 14px)}
  .mon .frm{width:34vw}
  .bub{display:none}
  .bottom{left:8px;right:8px;bottom:10px}
  .txt{height:126px;padding:8px 12px;font-size:17px;line-height:1.25}
  .stats{gap:12px;height:28px;margin-top:4px;font-size:10px}.stats .bar{width:56px;height:14px}.stats .hpb small{font-size:8px}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
  .menu button{max-width:none;height:50px;font-size:12px;gap:8px}.menu button svg{width:18px;height:18px}
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="box roster"><h3>* ЦЕЛЬ</h3><div class="list"></div></div>
<div class="mon"></div>
<div class="bub"><p></p></div>

<div class="bottom">
  <div class="box txt"></div>
  <div class="stats"><span class="mename"></span><span class="lv"></span><span class="hpb"><small>ОЗ</small><span class="bar"><i></i></span><span class="hpv"></span></span></div>
  <div class="menu">
    <button data-a="png"><svg class="ic" viewBox="0 0 13 13" shape-rendering="crispEdges"><path fill="currentColor" d="M10 0h3v3h-1v1h-1v1h-1v1H9v1H8v1H7v1h1v1h1v2H8v-1H7v-1H6v1H5v1H3v-2h1V9h1V8H4V7h1V6h1V5h1V4h1V3h1V2h1V1h0Zm-8 10h1v1H2v1H1v-1H0v-1h1V9h1Z"/></svg><svg class="h"><use href="#soul"/></svg>БИТВА</button>
    <button data-a="continue" class="on"><svg class="ic" viewBox="0 0 13 13" shape-rendering="crispEdges"><path fill="currentColor" d="M1 1h11v1h1v6h-1v1H6v1H5v1H4v1H3V9H1V8H0V2h1Zm1 2v4h9V3Z"/></svg><svg class="h"><use href="#soul"/></svg>ДЕЙСТВ.</button>
    <button data-a="all"><svg class="ic" viewBox="0 0 13 13" shape-rendering="crispEdges"><path fill="currentColor" d="M4 0h5v1h1v2h2v1h1v8h-1v1H1v-1H0V4h1V3h2V1h1Zm1 1v2h3V1Zm-3 4v6h9V5Z"/></svg><svg class="h"><use href="#soul"/></svg>ПРЕДМ.</button>
    <button data-a="new"><svg class="ic" viewBox="0 0 13 13" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h3v1h1v1h1v1h1v1h1V3h1V2h1V1h1V0h3v3h-1v1h-1v1H9v1H8v1h1v1h1v1h1v1h1v3H9v-1H8v-1H7V9H6v1H5v1H4v1H3v1H0V10h1V9h1V8h1V7h1V6H3V5H2V4H1V3H0Z"/></svg><svg class="h"><use href="#soul"/></svg>ПОЩАДА</button>
  </div>
</div>

<!-- душа: красное пиксельное сердце -->
<svg width="0" height="0" style="position:absolute"><symbol id="soul" viewBox="0 0 16 14"><path fill="#ff0000" shape-rendering="crispEdges" d="M1 1h5v1h1v1h2V2h1V1h5v1h1v5h-1v1h-1v1h-1v1h-1v1h-1v1H9v1H7v-1H6v-1H5v-1H4V9H3V8H2V7H1V6H0V2h1Z"/></symbol></svg>

<script src="bridge.js"></script>
<script src="common.js"></script>
<script>
const pl = PL;
const short = (c) => c.name.split(' ')[0];
const days = (c) => (NOW - c.ts) / 864e5;
const HINT = {
  png: tt('* Ты замахиваешься...\n* ...и меняешь картинку.'),
  continue: tt('* Продолжить разговор\n  с того места, где остановились.'),
  all: tt('* Ты роешься в карманах.\n* Здесь все ваши чаты.'),
  new: tt('* Ты щадишь прошлое.\n* Начать новый чат с чистого листа.'),
};

// пикселизация: уменьшаем на холсте и сводим к пяти оттенкам серого
function pix(src, h, cls) {
  const cv = document.createElement('canvas'); cv.className = cls;
  const im = new Image(); im.onload = () => {
    const w = Math.max(1, Math.round(h * im.width / im.height)); cv.width = w; cv.height = h;
    const x = cv.getContext('2d'); x.drawImage(im, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h), p = d.data;
    // автоуровни (самый тёмный — не чёрный, чтобы силуэт не тонул в фоне): растягиваем яркость (по 2-му и 98-му процентилю), чтобы тёмные картинки не превращались в кашу
    const Y = []; for (let k = 0; k < p.length; k += 4) if (p[k + 3] > 110) Y.push(p[k] * .3 + p[k + 1] * .59 + p[k + 2] * .11);
    Y.sort((a, b) => a - b); const lo = Y[Math.floor(Y.length * .02)] || 0, hi = Y[Math.floor(Y.length * .98)] || 255;
    for (let k = 0; k < p.length; k += 4) { const y = Math.min(1, Math.max(0, ((p[k] * .3 + p[k + 1] * .59 + p[k + 2] * .11) - lo) / (hi - lo || 1))); const g = 50 + Math.round(y * 3) * 68.3; p[k] = p[k + 1] = p[k + 2] = g; p[k + 3] = p[k + 3] > 110 ? 255 : 0; }
    x.putImageData(d, 0, 0);
  };
  im.src = src; return cv;
}
// печатная машинка для текстового окна (только текст, ничего не открывает)
let tw;
function type(s) { clearInterval(tw); const el = $('.txt'); let n = 0; el.textContent = ''; tw = setInterval(() => { el.textContent = s.slice(0, ++n); if (n >= s.length) clearInterval(tw); }, 28); }

const SOUL = '<svg class="sl"><use href="#soul"/></svg>';
$('.list').innerHTML = ITEMS.map((c, i) => `<button class="row" data-i="${i}">${SOUL}<span>* ${esc(c.name)}</span></button>`).join('');

let cur = 0, sel = 1;
function flavor(c) {
  const s = short(c), L = [tt`* ${s} стоит рядом.`];
  L.push(days(c) > 3 ? tt`* ${s} давно ждёт. Последний раз — ${ago(c.ts)}.` : tt`* ${c.msgs} ${pl(c.msgs, 'сообщение', 'сообщения', 'сообщений')} за ${c.chats} ${pl(c.chats, 'встречу', 'встречи', 'встреч')}.`);
  L.push(c.chats >= 5 ? tt('* Это наполняет тебя РЕШИМОСТЬЮ.') : tt`* ${s} присматривается к тебе.`);
  return L.join('\n');
}
function show(i) {
  cur = mod(i, ITEMS.length); const c = ITEMS[cur];
  $('.mename').textContent = meOf(cur).name.toUpperCase();
  const mon = $('.mon'); mon.innerHTML = '';
  if (c.render) mon.append(pix(c.render, 150, 'full'));
  else { const f = document.createElement('div'); f.className = 'frm'; f.append(pix(c.img, 128, '')); mon.append(f); }
  mon.classList.remove('in'); void mon.offsetWidth; mon.classList.add('in');
  $('.bub p').textContent = c.snip; $('.bub').style.display = c.snip ? '' : 'none';
  // LV — сколько чатов (как «любовь» в игре), ОЗ — свежесть встречи
  const lv = Math.min(20, Math.max(1, c.chats)), max = 16 + lv * 4, hp = Math.max(1, Math.round(max * (1 - Math.min(.95, days(c) / 7))));
  $('.lv').textContent = 'LV ' + lv; $('.hpv').textContent = `${hp} / ${max}`; $('.stats .bar i').style.width = (hp / max * 100) + '%';
  type(flavor(c));
  $$('.row').forEach((x, k) => x.classList.toggle('on', k === cur)); $$('.row')[cur].scrollIntoView({ block: 'nearest', inline: 'center' });
}
function pick(k, say) { sel = mod(k, 4); const bs = $$('.menu button'); bs.forEach((b, j) => b.classList.toggle('on', j === sel)); if (say) type(HINT[bs[sel].dataset.a]); }
$$('.menu button').forEach((b, j) => { b.onmouseenter = () => sel !== j && pick(j, true); b.onclick = () => ACT(b.dataset.a, ITEMS[cur]); });
$$('.row').forEach((x) => x.onclick = () => +x.dataset.i === cur ? ACT('continue', ITEMS[cur]) : show(+x.dataset.i));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowDown') pick(sel + 1, true); if (e.key === 'ArrowUp') pick(sel - 1, true);
  if (e.key === 'Enter') ACT($$('.menu button')[sel].dataset.a, ITEMS[cur]);
});
// ?i=N — открыть сразу N-го (для проверки)
const Q = new URLSearchParams(location.search).get('i');
show(Q != null ? +Q : START);
</script>
</body>
