<!-- Шрифты грузятся в фоне: если Google не отвечает, экран появится через 1,2 с системным шрифтом, а не останется пустым -->
<script>document.documentElement.classList.add('fw');setTimeout(() => document.documentElement.classList.remove('fw'), 1200);</script>
<style>.fw body{visibility:hidden}</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';document.documentElement.classList.remove('fw')" onerror="document.documentElement.classList.remove('fw')">
<style>
:root{--cc:#8cc152;--top:44px;--land:#e6dfcd;--road:#fff;--edge:#cfc6b1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--land);color:#fff;font-family:'Roboto Condensed',sans-serif}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* карта города: едет под выбранного персонажа */
.map{position:fixed;left:50%;top:50%;width:2400px;height:1600px;margin:-800px 0 0 -1200px;will-change:transform;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.map svg{width:100%;height:100%;display:block}
.map text{font-family:'Oswald',sans-serif;fill:#9d9480;letter-spacing:.14em}
.blip{transition:transform .3s}
.blip.on{transform:scale(1.35)}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse 70% 70% at 55% 55%,transparent 40%,#0003 100%);pointer-events:none}

/* герой стоит на своей метке */
.spot{position:fixed;left:56%;bottom:-3vh;width:min(60vh,520px);height:min(60vh,520px);transform:translate(-50%,0) scaleY(.42);border-radius:50%;background:radial-gradient(circle,var(--cc) 0,color-mix(in srgb,var(--cc) 60%,transparent) 40%,transparent 70%);opacity:.7;transition:background .4s;pointer-events:none}
.hero{position:fixed;left:56%;bottom:0;width:44vw;height:calc(100% - var(--top) - 3vh);transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.hero.in{animation:hin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes hin{from{opacity:0;transform:translateX(-50%) translateY(16px)}}
.hero img.full{max-height:96%;max-width:100%;object-fit:contain;filter:contrast(1.08) saturate(1.1) drop-shadow(0 22px 14px #0005)}
/* без PNG: полицейское фото на ростомере */
.hero .mug{position:relative;align-self:center;width:min(26vw,340px);aspect-ratio:3/4;margin-bottom:10vh;padding:10px 28px 46px;background:#f4f1ea;box-shadow:0 20px 40px #0006,0 0 0 1px #0002;transform:rotate(-2deg);
  background-image:repeating-linear-gradient(0deg,#0000 0 29px,#b8b2a4 29px 30px);background-origin:content-box;background-clip:content-box}
.hero .mug img{width:100%;height:100%;object-fit:cover;object-position:top;filter:contrast(1.05) saturate(.9)}
.hero .mug::after{content:attr(data-n);position:absolute;left:10px;right:10px;bottom:10px;height:28px;background:#1a1a1a;color:#fff;font:600 14px/28px 'Oswald';letter-spacing:.12em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}

/* имя и меню паузы слева */
.head{position:fixed;left:3vw;top:calc(var(--top) + 2.5vh);z-index:5;max-width:44vw}
.nm{font:700 clamp(40px,4.6vw,76px)/.95 'Oswald';text-transform:uppercase;letter-spacing:-.01em;color:#fff;-webkit-text-stroke:1.5px #111;paint-order:stroke fill;text-shadow:4px 4px 0 #111}
.sub{margin-top:10px;display:inline-block;padding:3px 10px;background:#111;font:500 14px 'Roboto Condensed';letter-spacing:.08em;text-transform:uppercase;color:#fff}
.menu{position:fixed;left:3vw;bottom:5vh;width:min(320px,26vw);z-index:5;background:#000c;padding:4px;display:flex;flex-direction:column;gap:2px}
.menu h4{font:600 13px 'Oswald';letter-spacing:.18em;text-transform:uppercase;padding:8px 12px 6px;color:#fffc;border-bottom:1px solid #fff2;margin-bottom:2px}
.menu button{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font:500 16px 'Roboto Condensed';text-transform:uppercase;letter-spacing:.04em;color:#fff;text-align:left;transition:none}
.menu button kbd{font:600 11px 'Oswald';padding:1px 6px;border:1px solid #fff5;color:#fffa}
.menu button:hover,.menu button.on{background:#fff;color:#111}
.menu button.on kbd,.menu button:hover kbd{border-color:#1115;color:#111a}

/* HUD: деньги и розыск */
.hud{position:fixed;right:calc(3vw + 56px);top:calc(var(--top) + 2.5vh);text-align:right;z-index:5}
.money{font:700 clamp(26px,2.4vw,38px) 'Oswald';color:#6ddc6d;-webkit-text-stroke:1.5px #111;paint-order:stroke fill;text-shadow:3px 3px 0 #111}
.wanted{margin-top:2px;display:flex;justify-content:flex-end;gap:3px}
.wanted svg{width:24px;height:24px;fill:#fff;filter:drop-shadow(2px 2px 0 #111)}
.wanted svg.off{fill:#fff4;filter:drop-shadow(1px 1px 0 #1118)}

/* колесо смены персонажа */
.wheel{position:fixed;right:3vw;bottom:5vh;width:min(42vh,340px);aspect-ratio:1;z-index:5}
.sectors{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 30%,#000 30.5%,#000 100%);mask:radial-gradient(circle,transparent 30%,#000 30.5%,#000 100%);box-shadow:0 10px 30px #0006}
.sec{position:absolute;inset:0;border-radius:50%;opacity:.78;transition:opacity .15s}
.sec.on{opacity:1}
.gaps{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ringo{position:absolute;inset:-3px;border-radius:50%;border:3px solid #fff;pointer-events:none}
.ringi{position:absolute;inset:30%;border-radius:50%;background:#111;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;pointer-events:none}
.ringi b{font:600 clamp(12px,1.1vw,16px)/1.05 'Oswald';text-transform:uppercase;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ringi small{margin-top:3px;font:400 11px 'Roboto Condensed';color:#fff9}
.slot{position:absolute;width:19%;aspect-ratio:1;margin:-9.5% 0 0 -9.5%;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#222;box-shadow:0 3px 8px #0006;transition:transform .15s;z-index:2}
.slot img{width:100%;height:100%;object-fit:cover;object-position:top;filter:saturate(.7) brightness(.85)}
.slot.on{transform:scale(1.18)}
.slot.on img{filter:none}
.hit{position:absolute;inset:0;border-radius:50%;z-index:1}
.pages{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:6px;align-items:center;font:600 13px 'Oswald';color:#111}
.pages button{width:28px;height:28px;background:#111;color:#fff;font-size:16px}
.pages span{min-width:40px;text-align:center}

@media (max-width:1000px){
  .map{transition-duration:.5s}
  .head{left:12px;right:12px;top:calc(var(--top) + 52px);max-width:none}
  .nm{font-size:34px;text-shadow:3px 3px 0 #111}
  .sub{margin-top:6px;font-size:12px}
  .hud{display:none}
  .hero{left:50%;width:100%;height:auto;top:calc(var(--headb,170px) + 10px);bottom:calc(248px + 30vw)}
  .hero img.full{max-height:100%}
  .hero .mug{height:100%;width:auto;max-width:62vw;margin-bottom:0;padding:6px 6px 32px}.hero .mug::after{height:22px;font-size:12px;line-height:22px;bottom:6px}
  .spot{left:50%;bottom:calc(248px + 20vw - 12vh);width:60vw;height:60vw}
  .wheel{left:50%;right:auto;bottom:12px;width:min(52vw,230px);transform:translateX(-50%)}
  .ringi b{font-size:11px}.ringi small{display:none}
  .pages{top:auto;bottom:calc(100% + 8px)}
  .menu{left:12px;right:12px;bottom:auto;top:calc(100% - 248px - 30vw + 16px);width:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
  .menu h4{display:none}
  .menu button{padding:9px 10px;font-size:13px}
  .menu button kbd{display:none}
}
</style>
</head>
<body>
<div class="map"></div><div class="vig"></div>
<div class="spot"></div><div class="hero"></div>
<div class="head"><div class="nm"></div><div class="sub"></div></div>
<div class="hud"><div class="money"></div><div class="wanted"></div></div>
<div class="menu"><h4>Персонаж</h4><button data-a="continue" class="on">Играть<kbd>Enter</kbd></button><button data-a="new">Новый чат<kbd>N</kbd></button><button data-a="all">Все чаты<kbd>A</kbd></button><button data-a="png">Своя картинка<kbd>P</kbd></button></div>
<div class="wheel"><div class="sectors"><div class="secs"></div><div class="gaps"></div></div><div class="ringo"></div><div class="hit"></div><div class="slots"></div><div class="ringi"><b></b><small></small></div><div class="pages"><button data-p="-1">‹</button><span class="pg"></span><button data-p="1">›</button></div></div>

<script src="bridge.js"></script>
<script src="common.js"></script>
<script>
const COLORS = ['#4aa3df', '#8cc152', '#f0a830', '#e05a6a', '#a46ddb', '#f2d14e'];
const colorOf = (c) => COLORS[Math.floor(seeded(c.name, 9) * COLORS.length)];
const STAR = (off) => `<svg class="${off ? 'off' : ''}" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.7l-6.1 3.4 1.4-6.8L2.2 9.6l6.9-.8z"/></svg>`;
const W = 2400, H = 1600;
// у каждого персонажа своё место на карте (стабильно по имени), в границах суши
const posOf = (c) => [260 + seeded(c.name, 21) * 1500, 220 + seeded(c.name, 22) * 900];

// ── карта: кварталы, проспекты, шоссе, парки, берег и ярлыки районов ──
(() => {
  const r = (k, i) => seeded('map' + k, i);
  let g = `<rect width="${W}" height="${H}" fill="var(--land)"/>`;
  // прибрежная вода справа внизу и залив
  const coast = `M${W} 0V${H}H1500C1420 1480 1520 1340 1640 1290S1900 1180 1960 1060 1880 860 2000 760 2300 700 ${W} 560Z`;
  g += `<path d="${coast}" fill="#b4d0dc"/><path d="${coast}" fill="none" stroke="#d6e6ec" stroke-width="28" opacity=".8"/><path d="${coast}" fill="none" stroke="#9cbfcd" stroke-width="3"/>`;
  // парки
  const parks = [[300, 300, 260, 180], [1100, 700, 320, 230], [500, 1150, 200, 170], [1600, 300, 220, 160], [900, 200, 150, 150], [1250, 1250, 230, 150]];
  for (const [x, y, w, h] of parks) g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="#cfdeb8"/>`;
  // сетка улиц: столбцы и ряды с лёгким дрейфом; каждая вторая — проспект пошире
  let roads = '', edges = '';
  const vcols = []; for (let x = 120; x < W; x += 150) vcols.push(x);
  const hrows = []; for (let y = 110; y < H; y += 120) hrows.push(y);
  vcols.forEach((x, i) => { const d = `M${x + (r('vx', i) - .5) * 40} 0C${x + (r('vc', i) - .5) * 120} ${H * .4} ${x + (r('vd', i) - .5) * 120} ${H * .7} ${x + (r('ve', i) - .5) * 60} ${H}`; const w = i % 3 === 1 ? 16 : 7; edges += `<path d="${d}" stroke-width="${w + 4}"/>`; roads += `<path d="${d}" stroke-width="${w}"/>`; });
  hrows.forEach((y, i) => { const d = `M0 ${y + (r('hy', i) - .5) * 30}C${W * .35} ${y + (r('hc', i) - .5) * 90} ${W * .65} ${y + (r('hd', i) - .5) * 90} ${W} ${y + (r('he', i) - .5) * 40}`; const w = i % 3 === 2 ? 16 : 7; edges += `<path d="${d}" stroke-width="${w + 4}"/>`; roads += `<path d="${d}" stroke-width="${w}"/>`; });
  // шоссе: два, жёлто-песочные, с тёмной кромкой
  const hw = ['M-50 1050C500 980 700 1300 1200 1150S1800 700 2450 600', 'M700 -50C650 400 300 700 450 1050S900 1550 850 1650'];
  g += `<g fill="none" stroke="var(--edge)" stroke-linecap="round">${edges}</g><g fill="none" stroke="var(--road)" stroke-linecap="round">${roads}</g>`;
  g += `<g fill="none" stroke-linecap="round">${hw.map((d) => `<path d="${d}" stroke="#c9b98a" stroke-width="30"/><path d="${d}" stroke="#f3e2a7" stroke-width="22"/><path d="${d}" stroke="#fff" stroke-width="2" stroke-dasharray="26 18"/>`).join('')}</g>`;
  // ярлыки районов
  const dists = [[tt('ЦЕНТР'), 760, 620, -4], [tt('ХОЛМЫ'), 360, 240, -8], [tt('ПОРТ'), 1700, 1380, 6], [tt('ПЛЯЖ'), 2080, 1000, 12], [tt('СТАРЫЙ ГОРОД'), 1300, 920, 2], [tt('АЭРОПОРТ'), 420, 1380, -2], [tt('ВИНОГРАДНИКИ'), 1500, 220, 5], [tt('КАНАЛЫ'), 1000, 1300, -6]];
  for (const [t, x, y, a] of dists) g += `<text x="${x}" y="${y}" font-size="30" font-weight="500" transform="rotate(${a} ${x} ${y})">${t}</text>`;
  // метки персонажей: цветной круг с первой буквой
  g += `<g class="blips">${ITEMS.map((c, i) => { const [x, y] = posOf(c); return `<g class="blip" data-i="${i}" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="22" fill="${colorOf(c)}" stroke="#fff" stroke-width="4"/><circle cx="${x}" cy="${y}" r="22" fill="none" stroke="#0004" stroke-width="1"/><text x="${x}" y="${y + 9}" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" letter-spacing="0" style="fill:#fff">${esc(c.name[0].toUpperCase())}</text></g>`; }).join('')}</g>`;
  $('.map').innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
})();

const PER = 8, pages = Math.ceil(ITEMS.length / PER);
let cur = 0;
function drawWheel() {
  const p = Math.floor(cur / PER), list = ITEMS.slice(p * PER, p * PER + PER), n = list.length, step = 360 / n;
  $('.slots').innerHTML = list.map((c, k) => { const a = -Math.PI / 2 + k / n * Math.PI * 2; return `<button class="slot" data-i="${p * PER + k}" style="left:${50 + Math.cos(a) * 36}%;top:${50 + Math.sin(a) * 36}%"><img decoding="async" src="${c.img}" alt=""></button>`; }).join('');
  $('.secs').innerHTML = list.map((c, k) => { const a0 = k * step - step / 2; return `<i class="sec" data-k="${p * PER + k}" style="background:conic-gradient(from ${a0}deg, ${colorOf(c)} 0 ${step}deg, transparent ${step}deg)"></i>`; }).join('');
  $('.gaps').style.background = `repeating-conic-gradient(from ${-step / 2 - 1}deg, #fff 0 2deg, transparent 2deg ${step}deg)`;
  $('.pg').textContent = `${p + 1} / ${pages}`;
  $$('.slot').forEach((s) => { s.onpointerenter = (e) => { if (e.pointerType === 'mouse') show(+s.dataset.i); }; s.onclick = () => +s.dataset.i === cur ? ACT('continue', ITEMS[cur]) : show(+s.dataset.i); });
}
// сектор под курсором или пальцем — по углу от центра колеса
function sectorAt(e) {
  const r = $('.wheel').getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
  if (Math.hypot(x, y) < r.width * .3) return null;
  const p = Math.floor(cur / PER), n = Math.min(PER, ITEMS.length - p * PER), a = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360 / n / 2 + 360) % 360;
  return p * PER + Math.floor(a / (360 / n));
}
$('.hit').addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse') return; const i = sectorAt(e); if (i != null && i !== cur) show(i); });
$('.hit').addEventListener('click', (e) => { const i = sectorAt(e); if (i == null) return; i === cur ? ACT('continue', ITEMS[cur]) : show(i); });
function panTo(c) {
  // масштаб и сдвиг такие, что край карты никогда не виден, какой бы широкий ни был экран
  const [x, y] = posOf(c), phone = matchMedia('(max-width:1000px)').matches, s = Math.max(phone ? .62 : .8, innerWidth / W * 1.04, innerHeight / H * 1.04);
  const ax = phone ? innerWidth / 2 : innerWidth * .56, ay = phone ? innerHeight * .42 : innerHeight * .8;
  const lim = (v, half, size) => Math.max(size / 2 - half, Math.min(half - size / 2, v));
  const tx = lim(ax - innerWidth / 2 - (x - W / 2) * s, W * s / 2, innerWidth), ty = lim(ay - innerHeight / 2 - (y - H / 2) * s, H * s / 2, innerHeight);
  $('.map').style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${s})`;
}
function show(i) {
  const before = Math.floor(cur / PER); cur = mod(i, ITEMS.length); const c = ITEMS[cur];
  if (Math.floor(cur / PER) !== before || !$('.slot')) drawWheel();
  document.documentElement.style.setProperty('--cc', colorOf(c));
  const h = $('.hero'); h.innerHTML = c.render ? `<img decoding="async" class="full" src="${c.render}" alt="">` : `<div class="mug" data-n="${esc(c.name)} · №${String(cur + 1).padStart(3, '0')}"><img decoding="async" src="${c.img}" alt=""></div>`; h.classList.remove('in'); void h.offsetWidth; h.classList.add('in');
  $('.nm').textContent = c.name; $('.sub').textContent = tt`${ago(c.ts)} · ${c.msgs} сообщ. · ${c.chats} чат.`;
  $('.ringi b').textContent = c.name; $('.ringi small').textContent = ago(c.ts);
  $('.money').textContent = '$' + c.msgs.toLocaleString(LANG);
  $('.wanted').innerHTML = Array.from({ length: 5 }, (_, k) => STAR(k >= Math.min(5, c.chats))).join('');
  $$('.slot').forEach((s) => s.classList.toggle('on', +s.dataset.i === cur));
  $$('.sec').forEach((s) => s.classList.toggle('on', +s.dataset.k === cur));
  $$('.blip').forEach((b) => b.classList.toggle('on', +b.dataset.i === cur));
  panTo(c);
}
$$('.pages button').forEach((b) => b.onclick = () => show((Math.floor(cur / PER) + +b.dataset.p + pages) % pages * PER));
$$('.menu button').forEach((b) => { b.onclick = () => ACT(b.dataset.a, ITEMS[cur]); b.onmouseenter = () => $$('.menu button').forEach((x) => x.classList.toggle('on', x === b)); });
addEventListener('resize', () => panTo(ITEMS[cur]));
new ResizeObserver(() => document.documentElement.style.setProperty('--headb', $('.head').getBoundingClientRect().bottom + 'px')).observe($('.head'));
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowDown') show(cur + 1); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') show(cur - 1);
  if (e.key === 'Enter') ACT('continue', ITEMS[cur]); if (e.key === 'n' || e.key === 'т') ACT('new', ITEMS[cur]); if (e.key === 'a' || e.key === 'ф') ACT('all', ITEMS[cur]); if (e.key === 'p' || e.key === 'з') ACT('png', ITEMS[cur]); });
$('.map').style.transition = 'none'; show(START); requestAnimationFrame(() => $('.map').style.transition = '');
</script>
</body>
</html>
