#app .mk-acts button { position: relative; padding: 13px 26px; font: 400 14px 'Rubik Mono One', sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #ffd36a; text-shadow: 2px 2px 0 #000, 0 -1px 0 #7a3a08;
    background: radial-gradient(circle at 7px 7px, #f0d29a 1.5px, #3a2410 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 7px) 7px, #f0d29a 1.5px, #3a2410 2.5px, transparent 3.5px), radial-gradient(circle at 7px calc(100% - 7px), #f0d29a 1.5px, #3a2410 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), #f0d29a 1.5px, #3a2410 2.5px, transparent 3.5px),
        repeating-linear-gradient(97deg, #ffffff06 0 2px, transparent 2px 7px), linear-gradient(#5e4a34, #3c2c1e 48%, #2a1c12 52%, #3a2a1c);
    box-shadow: inset 2px 2px 0 #9a7a52, inset -2px -2px 0 #120804, 0 0 0 2px #000, 0 0 0 4px #9a6a2a, 0 0 0 6px #000, 0 8px 0 4px #0009; transition: transform .06s, filter .1s; }
#app .mk-acts button:hover { filter: brightness(1.2); color: #fff3b0; }
#app .mk-acts button:active { transform: translateY(3px); box-shadow: inset 2px 2px 0 #9a7a52, inset -2px -2px 0 #120804, 0 0 0 2px #000, 0 0 0 4px #9a6a2a, 0 0 0 6px #000, 0 4px 0 4px #0009; }
#app .mk-acts .mk-go { padding: 16px 44px; font-size: 22px; color: #fff3c0; text-shadow: 3px 3px 0 #000, 0 0 12px #ffb03a;
    background: radial-gradient(circle at 8px 8px, #ffe0a0 1.5px, #4a0a04 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 8px) 8px, #ffe0a0 1.5px, #4a0a04 2.5px, transparent 3.5px), radial-gradient(circle at 8px calc(100% - 8px), #ffe0a0 1.5px, #4a0a04 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 8px) calc(100% - 8px), #ffe0a0 1.5px, #4a0a04 2.5px, transparent 3.5px),
        linear-gradient(#d4361a, #8a1206 50%, #6a0c04 52%, #9a1a08);
    box-shadow: inset 2px 2px 0 #ff8a5a, inset -2px -2px 0 #2a0402, 0 0 0 2px #000, 0 0 0 4px #e8b448, 0 0 0 6px #000, 0 8px 0 4px #0009, 0 0 30px #ff4a1a88; }
#app .mk-press { position: absolute; left: 0; right: 0; bottom: 104px; text-align: center; font: 400 14px 'Rubik Mono One', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #ffd36a; text-shadow: 2px 2px 0 #000; animation: mkpress 1s steps(1) infinite; z-index: 4; }
@keyframes mkpress { 50% { opacity: 0; } }
#app .mk-rnd { display: flex; gap: 10px; margin-left: 6px; }

#app .mk-flash { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font: 400 clamp(60px, 9vw, 150px)/1 'Russo One', sans-serif; text-transform: uppercase; color: #ffd23a; text-shadow: 0 6px 0 #6a1a04, 0 0 40px #ff3a1a; opacity: 0; pointer-events: none; z-index: 10; }
#app .mk-flash.go { animation: mk-flash .65s ease-out forwards; }

<body><div id="app" class="sh-l-mk"></div><div class="toast"></div>
<script src="bridge.js"></script>
<script>
// как в расширении: те же раскладка и данные (своя PNG — c.render, иначе аватар)
const NOW = Date.now();
const items = CHARS.slice(0, 14).map(c => { const name = c.name.replace(/\s+/g,' ').trim(); return { name, img: c.img, thumb: c.thumb || c.img, ts: c.last, msgs: c.msgs || 0, chats: c.chats, snip: c.snip || '', render: c.render || '' }; });
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(ts) { const m = (NOW - ts) / 60e3; if (m < 60) return Math.round(m) + tt(' мин назад'); if (m < 1440) return Math.round(m / 60) + tt(' ч назад'); const d = Math.round(m / 1440); return d === 1 ? tt('вчера') : d + tt(' дн назад'); }
const mark = (root, sel, i) => root.querySelectorAll(sel).forEach(x => x.classList.toggle('on', +x.dataset.i === i));
const toast = (() => { const t = document.querySelector('.toast'); let h; return s => { t.textContent = s; t.classList.add('show'); clearTimeout(h); h = setTimeout(() => t.classList.remove('show'), 1700); }; })();
function fullFig(el, c, mirror = false) {
    const img = el.querySelector('img');
    el.classList.toggle('is-render', !!c.render);
    el.classList.toggle('is-mirror', !!(mirror && c.render));
    img.src = c.render || c.img;
}


const L = {
    mk: {
        title: 'Mortal Kombat',
        hover: true,
        html: (items) => `
            <div class="mk-bg"></div><div class="mk-fire"></div><div class="mk-smoke"></div>
            <h1 class="mk-title">${tt("Выбери бойца")}</h1>
            <div class="mk-side mk-p1"><div class="mk-fig"><img decoding="async" alt=""></div><div class="mk-plate"><small>P1</small><b class="mk-n1"></b></div></div>
            <div class="mk-side mk-p2"><div class="mk-fig"><img decoding="async" alt=""></div><div class="mk-plate"><small>${tt("P2 · ты")}</small><b class="mk-n2"></b></div></div>
            <div class="mk-center"><div class="mk-grid">${items.map((c, i) => `<button class="mk-tile" data-i="${i}" title="${esc(c.name)}"><img src="${esc(c.thumb || c.img)}" alt="" decoding="async"></button>`).join('')}</div>
            <div class="mk-info"></div></div>
            <div class="mk-acts"><button class="mk-go" data-ui="fight">${tt("В бой")}</button><button data-act="new">${tt("Новый бой")}</button><button data-act="all">${tt("История")}</button>
                <span class="mk-rnd"><button data-render="set" title="${tt("Своя PNG в полный рост")}">PNG</button><button data-render="clear" title="${tt("Убрать свою PNG")}">✕</button></span></div>
            <div class="mk-press">${tt("Нажми Enter — в бой")}</div><div class="mk-flash">${tt("К бою!")}</div>`,
        mount(root, api) {
            root._fight = () => {
                const f = root.querySelector('.mk-flash');
                f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
                setTimeout(() => api.act('continue'), 650);
            };
            root.querySelector('[data-ui="fight"]').addEventListener('click', root._fight);
        },
        show(root, i, items) {
            const c = items[i], p1 = root.querySelector('.mk-p1');
            fullFig(p1.querySelector('.mk-fig'), c);
            p1.classList.remove('in'); void p1.offsetWidth; p1.classList.add('in');
            root.querySelector('.mk-n1').textContent = c.name;
            const me = api.me;
            fullFig(root.querySelector('.mk-p2 .mk-fig'), { img: me.img, render: '' });
            root.querySelector('.mk-n2').textContent = me.name;
            root.querySelector('.mk-info').textContent = tt`${c.msgs} сообщ. · ${ago(c.ts)}${c.render ? '' : tt(' · без своей картинки')}`;
            mark(root, '.mk-tile', i);
        },
        key(k, root, api) {
            const cols = 5, d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[k];
            if (d) { api.show(Math.max(0, Math.min(api.items.length - 1, api.current + d))); return true; }
            if (k === 'Enter') { root._fight(); return true; }
            return false;
        },
    },

    // Выбор спутника (Dragon Age): столб света, медальоны слева, лор справа
};
const root = document.getElementById('app'), LAY = L['mk'];
let current = 0;
const api = {
  show: (i) => show(Math.max(0, Math.min(items.length - 1, i))),
  act: (what) => SH.act(what, current),
  get current() { return current; }, get items() { return items; },
  get me() { return meOf(current); },
};
function show(i) { current = i; LAY.show(root, i, items); }
root.innerHTML = LAY.html(items);
LAY.mount?.(root, api);
show(START);
const touch = matchMedia('(hover: none)').matches;
root.addEventListener('mouseover', e => { if (touch || !LAY.hover) return; const c = e.target.closest('[data-i]'); if (c && +c.dataset.i !== current) show(+c.dataset.i); });
root.addEventListener('click', e => {
  if (e.target.closest('[data-render]')) return SH.act('png', current);
  const a = e.target.closest('[data-act]'); if (a) return api.act(a.dataset.act);
  const n = e.target.closest('[data-nav]'); if (n) return api.show(current + +n.dataset.nav);
  const c = e.target.closest('[data-i]'); if (!c) return;
  const i = +c.dataset.i; if (i !== current && (touch || !LAY.hover)) return show(i); api.act('continue');
});
addEventListener('keydown', e => {
  if (LAY.key?.(e.key, root, api)) return e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') api.show(current + (e.key === 'ArrowLeft' ? -1 : 1));
  if (e.key === 'Enter') api.act('continue');
});
</script></body></html>
